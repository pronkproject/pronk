context.properties = {
    core.daemon = true
    core.name = pronk-gpu-test
    support.dbus = false
    loop.rt-prio = 0
}
context.spa-libs = {
    support.* = support/libspa-support
    video.convert.* = videoconvert/libspa-videoconvert
}
context.modules = [
    {
        name = libpipewire-module-protocol-native
        args = {
            sockets = [
                { name = "pronk-gpu-test" }
                { name = "pipewire-0-pronk-core" mode = "0600" }
                { name = "pipewire-0-pronk-backend" mode = "0600" }
            ]
        }
    }
    {
        name = libpipewire-module-access
        args = {
            access.socket = {
                pronk-gpu-test = unrestricted
                pipewire-0-pronk-core = pronk-core
                pipewire-0-pronk-backend = pronk-backend
            }
        }
    }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]

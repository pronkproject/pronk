# Extra endpoints used only by the disposable WirePlumber policy gate. Keeping
# the access class server-authored lets the test exercise the real Flatpak,
# portal, and restricted selection hooks instead of trusting client props.
module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        { name = "pipewire-0-pronk-core" mode = "0600" }
        { name = "pipewire-0-pronk-backend" mode = "0600" }
        { name = "pipewire-0-test-flatpak" mode = "0600" }
        { name = "pipewire-0-test-portal" mode = "0600" }
        { name = "pipewire-0-test-restricted" mode = "0600" }
    ]
}

module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
        pipewire-0-pronk-core = "pronk-core"
        pipewire-0-pronk-backend = "pronk-backend"
        pipewire-0-test-flatpak = "flatpak"
        pipewire-0-test-portal = "portal"
        pipewire-0-test-restricted = "restricted"
    }
}

# Deterministic virtual sinks let the policy gate exercise exact CastKMS-audio
# access without depending on host ALSA devices. One has the production marker;
# the other represents an unknown future policy version and must stay hidden
# from the backend role.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "pronk.policy.test.castkms-audio"
            node.description = "Pronk policy CastKMS audio"
            media.class = "Audio/Sink"
            audio.rate = 48000
            audio.channels = 2
            audio.position = "FL,FR"
            monitor.channel-volumes = true
            node.pause-on-idle = false
            api.pronk.castkms.audio-sink = "v1"
            api.pronk.castkms.output-index = 1
        }
    }
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "pronk.policy.test.unknown-audio"
            node.description = "Pronk policy unknown audio"
            media.class = "Audio/Sink"
            audio.rate = 48000
            audio.channels = 2
            audio.position = "FL,FR"
            monitor.channel-volumes = true
            node.pause-on-idle = false
            api.pronk.castkms.audio-sink = "v2"
            api.pronk.castkms.output-index = 1
        }
    }
]

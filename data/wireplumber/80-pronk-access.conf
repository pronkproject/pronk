# Pronk requires WirePlumber 0.5.15 or newer.  That release introduced the
# permission-manager API used here; older releases must leave protected media
# unavailable rather than approximating these rules with asynchronous
# client:update_permissions calls.

access.permission-managers = [
    {
        name = "pronk-core-v1"
        default_permissions = "all"
        core_permissions = "all"
        rules = [
            # The control/capture process has no reason to inspect desktop
            # audio sources. It resolves the connector-bound CastKMS sink,
            # never a microphone or another capture source.
            {
                matches = [
                    { media.class = "Audio/Source" }
                ]
                actions = { set-permissions = "-" }
            }
        ]
    }
    {
        name = "pronk-backend-v1"
        # Restricted clients can construct their own stream node and inspect
        # ordinary graph infrastructure, but all capture sources are hidden
        # below unless a more specific rule grants them.
        default_permissions = "rx"
        core_permissions = "rwx"
        rules = [
            {
                matches = [
                    { media.class = "Video/Source" }
                    { media.class = "Audio/Source" }
                    { media.class = "Audio/Sink" }
                ]
                actions = { set-permissions = "-" }
            }
            {
                matches = [
                    {
                        media.class = "Video/Source"
                        api.pronk.private = "v1"
                    }
                ]
                actions = { set-permissions = "rx" }
            }
            {
                matches = [
                    {
                        media.class = "Audio/Sink"
                        api.pronk.castkms.audio-sink = "v1"
                    }
                ]
                actions = { set-permissions = "rx" }
            }
        ]
    }
]

# These matches run before WirePlumber's sandbox/default fallbacks.  The
# effective-access values are deliberately versioned: pronk-private-policy.lua
# verifies that both the manager and the matching rule were selected before it
# allows either classified client to resume.
access.rules = [
    {
        matches = [ { access = "pronk-core" } ]
        actions = {
            update-props = {
                access = "pronk-core-policy-v1"
                permission_manager_name = "pronk-core-v1"
            }
        }
    }
    {
        matches = [ { access = "pronk-backend" } ]
        actions = {
            update-props = {
                access = "pronk-backend-policy-v1"
                permission_manager_name = "pronk-backend-v1"
            }
        }
    }
]

wireplumber.components = [
    {
        name = pronk-private-policy.lua
        type = script/lua
        provides = policy.pronk.private-permissions-v1
    }
    {
        name = pronk-policy-marker.lua
        type = script/lua
        provides = metadata.pronk-policy-v1
        requires = [
            policy.client.access
            policy.pronk.private-permissions-v1
        ]
    }
]

# Register Pronk's final access hook before the standard client-added trigger
# can dispatch an access decision.  This also makes the marker's dependency on
# policy.client.access cover the complete hook chain, not merely a script that
# happened to load later.
wireplumber.components.rules = [
    {
        matches = [
            { provides = "script.client.select-access" }
        ]
        actions = {
            merge = {
                requires = [ policy.pronk.private-permissions-v1 ]
            }
        }
    }
]

wireplumber.profiles = {
    main = { metadata.pronk-policy-v1 = required }
    policy = { metadata.pronk-policy-v1 = required }
}

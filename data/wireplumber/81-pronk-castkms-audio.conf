# CastKMS registers one ALSA card only while an audio-capable cast display is
# attached. The card and its sole PCM carry that display's assigned Device
# name; the technical long name retains the stable output index used to join
# the sink to its DRM connector. Generated PipeWire node names are never
# identity.

monitor.alsa.rules = [
    {
        matches = [
            {
                # This property is available before ACP chooses a profile set.
                api.alsa.card.longname = "~^CastKMS output [0-9]+ audio:"
            }
        ]
        actions = {
            update-props = {
                # ACP always adds its generic Pro Audio profile, even to a
                # custom profile set. CastKMS has one fixed stereo playback
                # PCM, so exposing it directly avoids both an irrelevant
                # configuration choice and restored-profile races.
                api.alsa.use-acp = false
                device.form-factor = "tv"
                device.icon-name = "video-display"
            }
        }
    }
    {
        matches = [
            {
                media.class = "Audio/Sink"
                api.alsa.card.longname = "~^CastKMS output [0-9]+ audio:"
                api.alsa.pcm.stream = "playback"
            }
        ]
        actions = {
            update-props = {
                audio.channels = 2
                audio.position = "FL,FR"
                api.pronk.castkms.audio-sink = "v1"
                media.role = "Screen"
                # Pronk captures the sink monitor rather than the discarded
                # virtual-ALSA playback stream. Apply the user-facing sink
                # volume to that monitor so desktop volume and mute controls
                # affect the audio delivered to the cast Device.
                monitor.channel-volumes = true
                # Generic priority must not make an idle route outrank local
                # audio. The policy below performs a one-shot switch when an
                # attachment-owned card appears.
                priority.session = 100
            }
        }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 0 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 0 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 1 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 1 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 2 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 2 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 3 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 3 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 4 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 4 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 5 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 5 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 6 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 6 } }
    }
    {
        matches = [ { api.alsa.card.longname = "~^CastKMS output 7 audio:" } ]
        actions = { update-props = { api.pronk.castkms.output-index = 7 } }
    }
]

wireplumber.components = [
    {
        name = pronk-cast-audio-default.lua
        type = script/lua
        provides = policy.pronk.cast-audio-default-v1
        requires = [
            metadata.default
            policy.default-nodes
        ]
    }
]

wireplumber.profiles = {
    main = { policy.pronk.cast-audio-default-v1 = required }
    policy = { policy.pronk.cast-audio-default-v1 = required }
}

# Pronk connects these endpoints itself. Device backends receive only fresh
# already-connected fds and never receive a socket pathname.
module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        {
            name = "pipewire-0-pronk-core"
            mode = "0600"
            props = { pronk.connection = "core" }
        }
        {
            name = "pipewire-0-pronk-backend"
            mode = "0600"
            props = { pronk.connection = "backend" }
        }
    ]
}

# The access module authors pipewire.access from the server socket name. The
# matching WirePlumber policy is responsible for per-object permissions.
module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
        pipewire-0-pronk-core = "pronk-core"
        pipewire-0-pronk-backend = "pronk-backend"
    }
}

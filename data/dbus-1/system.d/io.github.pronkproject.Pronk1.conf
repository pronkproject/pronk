<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="pronk">
    <allow own="io.github.pronkproject.Pronk1"/>
    <allow send_destination="io.github.pronkproject.Pronk1"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"/>

    <!-- Authenticate both ends of each private backend connection against
         their exact systemd units. -->
    <allow send_destination="org.freedesktop.systemd1"
           send_path="/org/freedesktop/systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnitByPID"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_path="/org/freedesktop/systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="GetUnitByInvocationID"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.freedesktop.systemd1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>

    <!-- Polkit independently restricts this to exact Pronk backend
         instances. -->
    <allow send_destination="org.freedesktop.systemd1"
           send_path="/org/freedesktop/systemd1"
           send_interface="org.freedesktop.systemd1.Manager"
           send_member="StopUnit"/>
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_path="/org/freedesktop/PolicyKit1/Authority"
           send_interface="org.freedesktop.PolicyKit1.Authority"
           send_member="CheckAuthorization"/>
  </policy>

  <!-- The default receive denial below also applies when pronkd calls out
       while owning its well-known name. Let systemd's root connection
       receive only the matching validator and cleanup calls. -->
  <policy user="root">
    <allow receive_sender="io.github.pronkproject.Pronk1"
           receive_interface="org.freedesktop.systemd1.Manager"
           receive_member="GetUnitByPID"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"
           receive_interface="org.freedesktop.systemd1.Manager"
           receive_member="GetUnitByInvocationID"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"
           receive_interface="org.freedesktop.DBus.Properties"
           receive_member="Get"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"
           receive_interface="org.freedesktop.DBus.Properties"
           receive_member="GetAll"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"
           receive_interface="org.freedesktop.systemd1.Manager"
           receive_member="StopUnit"/>
  </policy>

  <!-- Inventory and state are public. Control methods silently require a
       previously acquired polkit authorization before changing state. -->
  <policy context="default">
    <allow send_destination="io.github.pronkproject.Pronk1"
           send_interface="io.github.pronkproject.Pronk1.Manager"/>
    <allow send_destination="io.github.pronkproject.Pronk1"
           send_interface="io.github.pronkproject.Pronk1.Operation"/>
    <allow send_destination="io.github.pronkproject.Pronk1"
           send_interface="io.github.pronkproject.Pronk1.CastDisplay"/>
    <allow send_destination="io.github.pronkproject.Pronk1"
           send_interface="io.github.pronkproject.Pronk1.MediaSession"/>
    <allow receive_sender="io.github.pronkproject.Pronk1"/>
  </policy>
</busconfig>

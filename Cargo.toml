[workspace]
resolver = "2"
members = [
    "crates/castkms-sys",
    "crates/pronk",
    "crates/pronk-backend-mock",
    "crates/pronk-backend-host",
    "crates/pronk-backend-protocol",
    "crates/pronk-chromiacast",
    "crates/pronk-core",
    "crates/pronk-dbus",
    "crates/pronk-media",
    "crates/pronk-pipewire",
    "crates/pronk-systemd",
    "crates/pronk-userns",
    "crates/pronkctl",
    "tests/backend-activation",
    "tests/castkms-live",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chromiacast = { version = "0.3.1", features = ["discovery"] }
futures-util = "0.3"
gstreamer = { version = "=0.23.7", features = ["v1_20"] }
gstreamer-app = { version = "=0.23.5", features = ["v1_20"] }
gstreamer-base = { version = "=0.23.6", features = ["v1_20"] }
gstreamer-video = { version = "=0.23.5", features = ["v1_20"] }
nix = { version = "=0.29.0", features = ["event", "fs", "ioctl", "process", "signal", "socket", "time", "uio", "user"] }
pipewire = { version = "=0.10.1", features = ["v1_2_0"] }
sd-notify = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "=1.47.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
toml = { version = "=0.8.22", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
zbus = { version = "=5.12.0", default-features = false, features = ["p2p", "tokio"] }
zvariant = { version = "=5.8.0", features = ["option-as-array"] }
# zeroize 1.9 uses Edition 2024 and cannot be parsed by the declared Rust 1.83
# toolchain. Keep the compatible version selected by chromiacast's own lockfile.
zeroize = "=1.8.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
